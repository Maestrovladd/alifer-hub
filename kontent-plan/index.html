<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алифер · контент-план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f1eb;
  --ink: #1f1f1c;
  --muted: #6f6b63;
  --line: #ddd7cc;
  --yellow: #ffe566;
  --phase: #efefef;
  --sense: #e7e7e7;
  --blue: #d7ebfa;
  --pink: #f8d9d2;
  --green: #d9ecd0;
  --lilac: #e4ddf4;
  --cream: #fff4cc;
  --terra: #b4553a;
  --paper: #fff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Manrope, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.35;
  min-height: 100dvh;
}

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(243,241,235,.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px 10px;
}
.top h1 { font-size: 16px; font-weight: 800; }
.top p { margin-top: 3px; font-size: 12px; color: var(--muted); max-width: 90ch; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.legend i {
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 9px;
}

.wrap {
  padding: 12px 16px 28px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* —— matrix like Miro table —— */
.matrix {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 210px;
  width: max-content;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 8px 24px rgba(0,0,0,.05);
}

.col {
  border-right: 1px solid var(--line);
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper);
}
.col:last-child { border-right: 0; }
.col[aria-selected="true"] { background: #fffaf6; }
.col[aria-selected="true"] .sense-cell {
  outline: 2px solid var(--terra);
  outline-offset: -2px;
}

.num-cell {
  background: var(--yellow);
  text-align: center;
  font-weight: 800;
  font-size: 15px;
  padding: 8px 6px;
  border-bottom: 1px solid #ead97a;
}
.date-cell {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  padding: 6px;
  border-bottom: 1px solid var(--line);
  background: #fafafa;
}
.phase-cell {
  background: var(--phase);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
  padding: 8px 9px;
  border-bottom: 1px solid var(--line);
  min-height: 64px;
}
.phase-cell .to {
  display: block;
  margin-top: 4px;
  color: var(--terra);
  font-size: 10px;
  font-weight: 800;
}
.sense-cell {
  appearance: none;
  border: 0;
  background: var(--sense);
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.3;
  padding: 10px 9px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
  min-height: 92px;
  color: inherit;
}
.sense-cell:hover { filter: brightness(.98); }
.cta-cell {
  font-size: 11px;
  font-weight: 700;
  padding: 8px 9px;
  background: #1c1f1a;
  color: #f4efe6;
  line-height: 1.3;
}
.cta-cell span {
  display: block;
  color: #e2a98f;
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 2px;
  font-weight: 800;
}
.open-hint {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  padding: 5px 6px;
  background: #f7f5f0;
  border-top: 1px solid var(--line);
  font-weight: 600;
}

/* phase band visual continuity */
.col[data-phase="1"] .phase-cell { background: #ececec; }
.col[data-phase="2"] .phase-cell { background: #e8eef5; }
.col[data-phase="3"] .phase-cell { background: #eee8f3; }
.col[data-phase="4"] .phase-cell { background: #f5e9e4; }

/* —— detail under board —— */
.detail {
  display: none;
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  overflow: hidden;
}
.detail.open { display: block; }
.detail-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #faf8f3;
}
.detail-head h2 {
  font-size: 14px;
  font-weight: 800;
  line-height: 1.3;
  max-width: 70ch;
}
.detail-head p {
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
}
.detail-head button {
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 7px 11px;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.flow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0;
}
.card {
  padding: 12px 14px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  line-height: 1.4;
  min-height: 0;
}
.card:last-child { border-right: 0; }
.card .label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #666;
  margin-bottom: 4px;
}
.card .title {
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 6px;
}
.card ul { padding-left: 1.1em; }
.card li { margin-bottom: 3px; }
.card.blue { background: var(--blue); }
.card.pink { background: var(--pink); }
.card.green { background: var(--green); }
.card.lilac { background: var(--lilac); }
.card.cream { background: var(--cream); }

.jump {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 0 16px 4px;
}
.jump button {
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.jump button:hover { border-color: var(--terra); }

@media (max-width: 700px) {
  .matrix { grid-auto-columns: 168px; }
  .sense-cell { font-size: 12px; min-height: 110px; }
  .phase-cell { min-height: 72px; font-size: 10px; }
}
</style>
</head>
<body>

<header class="top">
  <h1>Контент-план · Алифер</h1>
  <p>Горизонтальная лента: этап → смысл дня → куда греем. Листай вправо. Кликни смысл дня — раскладка поста / сторис ниже.</p>
  <div class="legend">
    <i>серый — смысл дня</i>
    <i>цвет этапа — куда ведём блок дней</i>
    <i>чёрная полоса — куда зовём сегодня</i>
  </div>
</header>

<nav class="jump" aria-label="Этапы">
  <button type="button" data-jump="1">Этап 1 · дни 1–4 · анкета</button>
  <button type="button" data-jump="5">Этап 2 · дни 5–11 · магнит</button>
  <button type="button" data-jump="12">Этап 3 · дни 12–17 · предзапись</button>
  <button type="button" data-jump="18">День 18 · закрытый эфир</button>
</nav>

<div class="wrap">
  <div class="matrix" id="matrix"></div>
  <aside class="detail" id="detail" aria-live="polite">
    <div class="detail-head">
      <div>
        <h2 id="d-title"></h2>
        <p id="d-sub"></p>
      </div>
      <button type="button" id="d-close">Свернуть</button>
    </div>
    <div class="flow" id="d-flow"></div>
  </aside>
</div>

    ]},

      {type:"lilac",label:"В день эфира",title:"Сторис / бот",items:["Утром / за час / «мы в эфире»","Напоминание в боте"]}

const matrix = document.getElementById("matrix");
const detail = document.getElementById("detail");
const dTitle = document.getElementById("d-title");
const dSub = document.getElementById("d-sub");
const dFlow = document.getElementById("d-flow");
let selected = null;

function render() {
  matrix.innerHTML = "";
  DAYS.forEach(d => {
    const col = document.createElement("article");
    col.className = "col";
    col.id = `day-${d.n}`;
    col.dataset.phase = d.phase;
    col.dataset.n = d.n;
    col.innerHTML = `
      <div class="num-cell">${d.n}</div>
      <div class="date-cell">День ${d.n}</div>
      <div class="phase-cell">${d.phaseTitle}<span class="to">${d.phaseCta}</span></div>
      <button type="button" class="sense-cell" data-open="${d.n}">${d.sense}</button>
      <div class="cta-cell"><span>Куда зовём</span>${d.cta}</div>
      <div class="open-hint">нажми смысл · раскладка</div>
    `;
    matrix.appendChild(col);
  });
}

function openDay(n) {
  const d = DAYS.find(x => x.n === n);
  if (!d) return;
  if (selected === n && detail.classList.contains("open")) {
    closeDetail();
    return;
  }
  selected = n;
  document.querySelectorAll(".col").forEach(c => {
    c.setAttribute("aria-selected", c.dataset.n === String(n) ? "true" : "false");
  });
  dTitle.textContent = `День ${d.n}. ${d.sense}`;
  dSub.textContent = `${d.phaseTitle} · ${d.cta}`;
  dFlow.innerHTML = d.blocks.map(b => `
    <section class="card ${b.type}">
      <div class="label">${b.label}</div>
      <div class="title">${b.title}</div>
      <ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul>
    </section>
  `).join("");
  detail.classList.add("open");
  detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeDetail() {
  selected = null;
  detail.classList.remove("open");
  document.querySelectorAll(".col").forEach(c => c.setAttribute("aria-selected", "false"));
}

matrix.addEventListener("click", e => {
  const btn = e.target.closest("[data-open]");
  if (!btn) return;
  openDay(Number(btn.dataset.open));
});

document.getElementById("d-close").addEventListener("click", closeDetail);

document.querySelectorAll(".jump button").forEach(btn => {
  btn.addEventListener("click", () => {
    const el = document.getElementById(`day-${btn.dataset.jump}`);
    el?.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    openDay(Number(btn.dataset.jump));
  });
});

render();
</script>
</body>
</html>
