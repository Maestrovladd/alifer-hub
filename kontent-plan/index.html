<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алифер · контент-план · 21 день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F6F2E9;
  --sage: #DCE2D2;
  --dark: #23281F;
  --ink: #23281F;
  --terra: #B4553A;
  --muted: #6C7266;
  --box: #EAE5D8;
  --clay: #E2A98F;
  --bg: #D6D0C2;
  --paper: #F6F2E9;
  --line: rgba(35,40,31,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Manrope, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100dvh;
}
.page { max-width: 1280px; margin: 0 auto; padding: 22px 18px 48px; }

.hero {
  background: var(--cream);
  border-radius: 16px;
  padding: 22px 24px;
  box-shadow: 0 10px 28px rgba(35,40,31,.12);
  margin-bottom: 18px;
}
.hero .eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--terra);
  font-weight: 800;
  margin-bottom: 8px;
}
.hero h1 {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 700;
  line-height: 1.18;
  max-width: 22ch;
  margin-bottom: 8px;
}
.hero p { color: var(--muted); max-width: 62ch; font-size: 15px; }

/* ===== ЭТАПЫ: отдельные огромные плашки ===== */
.stages {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.stage {
  border-radius: 16px;
  padding: 18px 16px 16px;
  box-shadow: 0 8px 22px rgba(35,40,31,.1);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 190px;
  cursor: pointer;
  appearance: none;
  border: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: transform .15s ease;
}
.stage:hover { transform: translateY(-2px); }
.stage .n {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .7;
}
.stage .days {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
}
.stage .range { font-size: 13px; font-weight: 700; color: var(--muted); }
.stage h2 {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
  margin-top: 4px;
}
.stage .warm {
  margin-top: auto;
  background: var(--dark);
  color: var(--cream);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.3;
}
.stage .warm small {
  display: block;
  color: var(--clay);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 2px;
  font-weight: 800;
}
.stage.s1 { background: var(--sage); }
.stage.s2 { background: #E8EEE3; }
.stage.s3 { background: #F0E4DC; }
.stage.s4 { background: var(--dark); color: var(--cream); }
.stage.s4 .range { color: #A8A297; }
.stage.s4 .warm { background: #303626; }

.hint {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 12px;
  font-weight: 600;
}

.board-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--paper);
  border-radius: 16px;
  box-shadow: 0 10px 28px rgba(35,40,31,.12);
}
.board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 210px;
  width: max-content;
  min-width: 100%;
}
.col {
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.col:last-child { border-right: 0; }
.col[aria-selected="true"] .sense {
  outline: 2px solid var(--terra);
  outline-offset: -2px;
  background: #FFF8F0;
}
.badge {
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.col[data-phase="1"] .badge { background: var(--sage); color: #3a4634; }
.col[data-phase="2"] .badge { background: #E8EEE3; color: #3a4634; }
.col[data-phase="3"] .badge { background: #F0E4DC; color: #5a3a2e; }
.col[data-phase="4"] .badge { background: var(--dark); color: var(--clay); }
.num {
  background: #FFE27A;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  padding: 10px 6px;
  border-bottom: 1px solid rgba(35,40,31,.08);
}
.sense {
  appearance: none;
  border: 0;
  background: #F1EDE3;
  width: 100%;
  flex: 1;
  text-align: left;
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.4;
  padding: 14px 12px;
  cursor: pointer;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  min-height: 140px;
}
.sense:hover { background: #EAE4D6; }
.warm-cell {
  background: var(--dark);
  color: var(--cream);
  padding: 12px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.35;
}
.warm-cell small {
  display: block;
  color: var(--clay);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.detail {
  display: none;
  margin-top: 16px;
  background: var(--cream);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(35,40,31,.1);
}
.detail.open { display: block; }
.detail-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px;
  background: var(--sage);
  border-bottom: 1px solid var(--line);
}
.detail-head h2 {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.3;
  max-width: 60ch;
}
.detail-head p { margin-top: 6px; color: var(--muted); font-size: 13px; }
.detail-head .warm-tag {
  display: inline-block;
  margin-top: 8px;
  background: var(--dark);
  color: var(--cream);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 800;
}
.detail-head button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--cream);
  border-radius: 10px;
  padding: 10px 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  height: fit-content;
}
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card {
  padding: 18px 18px 20px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.5;
}
.card .label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--terra);
  margin-bottom: 6px;
}
.card .title {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 10px;
}
.card p { margin-bottom: 10px; color: var(--ink); }
.card p:last-child { margin-bottom: 0; }
.card.blue { background: #E8EEE3; }
.card.pink { background: #F0E4DC; }
.card.green { background: #D5E0C8; }
.card.lilac { background: #EDE8E0; }
.card.cream { background: #FFF6E8; }

@media (max-width: 980px) {
  .stages { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .stages { grid-template-columns: 1fr; }
  .board { grid-auto-columns: 180px; }
  .page { padding: 14px 12px 36px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="eyebrow">Наталья Алифер · 21 день</div>
    <h1>Контент-план до закрытого эфира</h1>
    <p>Сначала четыре этапа. На каждом написано, сколько дней и куда зовём человека. Потом лента дней. Кликни день — пост и сторис живым текстом.</p>
  </header>

  <nav class="stages" aria-label="Этапы прогрева">
    <button type="button" class="stage s1" data-jump="1">
      <span class="n">Этап 1</span>
      <div class="days">7 дней</div>
      <div class="range">Дни 1–7</div>
      <h2>Узнавание. «Это всё про меня»</h2>
      <div class="warm"><small>Куда греем весь этап</small>Анкета + лекция «5 признаков»</div>
    </button>
    <button type="button" class="stage s2" data-jump="8">
      <span class="n">Этап 2</span>
      <div class="days">7 дней</div>
      <div class="range">Дни 8–14</div>
      <h2>Старые способы мертвы. Корень — кишечник</h2>
      <div class="warm"><small>Куда греем весь этап</small>Видео-магнит</div>
    </button>
    <button type="button" class="stage s3" data-jump="15">
      <span class="n">Этап 3</span>
      <div class="days">6 дней</div>
      <div class="range">Дни 15–20</div>
      <h2>Система, кейсы, очередь</h2>
      <div class="warm"><small>Куда греем весь этап</small>Предзапись на закрытый эфир</div>
    </button>
    <button type="button" class="stage s4" data-jump="21">
      <span class="n">Этап 4</span>
      <div class="days">1 день</div>
      <div class="range">День 21</div>
      <h2>Закрытый эфир</h2>
      <div class="warm"><small>Куда греем весь этап</small>Явка на эфир</div>
    </button>
  </nav>

  <p class="hint">Лента дней · кликни смысл · снизу откроется текст поста и сторис</p>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <aside class="detail" id="detail" aria-live="polite">
    <div class="detail-head">
      <div>
        <h2 id="d-title"></h2>
        <p id="d-sub"></p>
        <div class="warm-tag" id="d-warm"></div>
      </div>
      <button type="button" id="d-close">Свернуть</button>
    </div>
    <div class="flow" id="d-flow"></div>
  </aside>
</div>

<script>
const DAYS = [
{
  n:1, phase:1, badge:"Этап 1 · узнавание",
  sense:"Открываем разговор: шар к вечеру, усталость, спокойный бланк — и это уже не «просто так живёт»",
  warm:"Анкета + «5 признаков»",
  blocks:[
    {type:"cream", label:"Пост / кружок", title:"Сколько женщин так живут",
     paras:["К вечеру живот как шар. Утром нет сил. Кофе не берёт. На бланке «норма», а тебе не нормально. И жизнь будто так и должна выглядеть.",
             "В ближайшие дни разберём, почему «всё правильно» не держит вес, кожу и живот. И с чего начинать, если узнала себя."]
    },
    {type:"lilac", label:"Сторис", title:"Сначала живое, потом смысл",
     paras:["Покажи обычное утро или день, без продажи.",
             "Спроси голосовалкой: что ближе — вздутие, вес, кожа, сладкое или нет сил.",
             "Напиши: если узнала себя хотя бы в одном, оставайся рядом.",
             "В конце мягко: есть короткая анкета и подарок за неё. Кнопка будет в ближайшие дни."]
    }
  ]
},
{
  n:2, phase:1, badge:"Этап 1 · узнавание",
  sense:"День телом: утро уже не то, кабинет, зеркало «как будто слегка отравилась»",
  warm:"Анкета сигналов",
  blocks:[
    {type:"blue", label:"Пост", title:"День, который узнают руками",
     paras:["Проснулась уже уставшей. Спала восемь часов. К обеду живот уже не тот, с которым утром застёгивала джинсы. К вечеру хочется расстегнуть пуговицу, и это уже не событие, а привычка.",
             "В кабинете сдерживаешься. В брюках стыдно. Это не характер и не «просто возраст»."]
    },
    {type:"lilac", label:"Сторис", title:"Три кадра одного дня",
     paras:["Скажи: сегодня про тело, без морали.",
             "Утро / обед / вечер — три коротких кадра.",
             "Добавь чужие фразы «как у меня», если есть.",
             "В конце: заполни анкету сигналов, если день узнала."]

},
{
  n:3, phase:1, badge:"Этап 1 · узнавание",

  warm:"Анкета",

             "Ты орёшь на себя: вот я слабая. А сила воли к вечеру кончается, потому что ты бьёшься не с характером, а с кругом."]
    },
    {type:"lilac", label:"Сторис", title:"Как показать гонку",
     paras:["Начни с живой еды или кофе в кадре.",
             "Коротко разложи день: взлёт, пустота, снова сладкое, вина.",
             "Спроси: узнала? Тогда анкета."]
    }
  ]
},
{
  n:4, phase:1, badge:"Этап 1 · узнавание",
  sense:"Бланк спокойный — тебе не спокойно. «Норма» ещё не здоровье",
  warm:"Анкета + подарок",
  blocks:[
    {type:"blue", label:"Пост", title:"Можно быть на «норме» и жить плохо",
     paras:["Референс лаборатории про болезнь. Не про то, как ты встаёшь и застёгиваешься. Можно быть «в норме» на бумажке и чувствовать себя на двадцать из ста.",
             "ChatGPT видит бланк. Он не видит твоё утро."]
    },
    {type:"pink", label:"Кружок", title:"Наталья",
     paras:["Скажи своим голосом, почему ты не останавливаешься на фразе «всё в норме», если человеку уже тяжело."]
    },
    {type:"lilac", label:"Сторис", title:"Норма против самочувствия",
     paras:["Сначала живой кадр дня.",

             "Опрос: тебе говорили «всё ок», а телу нет?",

    }
  ]
},
{
  n:5, phase:1, badge:"Этап 1 · узнавание",

  blocks:[
    {type:"blue", label:"Пост", title:"Признаки без спойлера всей лекции",
     paras:["Утро уже вздутое. Сыпь или реакция на молочку. Вес стоит, хотя «ешь правильно». Волосы, железо, бледность. Сладкое до трясучки.",
             "Если узнала себя хотя бы в двух — заполни анкету сегодня. Подарок за неё: лекция, которую можно смотреть четырнадцать дней."]

    {type:"cream", label:"Дожим", title:"Сегодня",

     paras:["Три коротких кадра по признакам.",

    }
  ]
},
{
  n:6, phase:1, badge:"Этап 1 · узнавание",
  sense:"Что делают годами вместо помощи: терпеть, банка, «само пройдёт»",
  warm:"Догнать анкету. Мягко намекнуть на магнит",
  blocks:[
    {type:"blue", label:"Пост", title:"Если помогало — почему ты всё ещё здесь?",
     paras:["Две недели легче. Потом как было. Отвлечься. Подождать чуда. Искать одну технику, которая «наконец закроет всё».",

const board = document.getElementById("board");
const detail = document.getElementById("detail");
const dTitle = document.getElementById("d-title");
const dSub = document.getElementById("d-sub");
const dWarm = document.getElementById("d-warm");
const dFlow = document.getElementById("d-flow");
let selected = null;

function render() {
  board.innerHTML = "";
  DAYS.forEach(d => {
    const col = document.createElement("article");
    col.className = "col";
    col.id = `day-${d.n}`;
    col.dataset.phase = d.phase;
    col.dataset.n = d.n;
    col.innerHTML = `
      <div class="badge">${d.badge}</div>
      <div class="num">${d.n}</div>
      <button type="button" class="sense" data-open="${d.n}">${d.sense}</button>
      <div class="warm-cell"><small>Куда зовём сегодня</small>${d.warm}</div>`;
    board.appendChild(col);
  });
}

function openDay(n) {
  const d = DAYS.find(x => x.n === n);
  if (!d) return;
  if (selected === n && detail.classList.contains("open")) { closeDetail(); return; }
  selected = n;
  document.querySelectorAll(".col").forEach(c => c.setAttribute("aria-selected", c.dataset.n === String(n) ? "true" : "false"));
  dTitle.textContent = `День ${d.n}. ${d.sense}`;
  dSub.textContent = d.badge;
  dWarm.textContent = `Куда зовём: ${d.warm}`;
  dFlow.innerHTML = d.blocks.map(b =>
    `<section class="card ${b.type}">
      <div class="label">${b.label}</div>
      <div class="title">${b.title}</div>
      ${b.paras.map(p => `<p>${p}</p>`).join("")}
    </section>`
  ).join("");
  detail.classList.add("open");
  detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeDetail() {
  selected = null;
  detail.classList.remove("open");
  document.querySelectorAll(".col").forEach(c => c.setAttribute("aria-selected", "false"));
}

board.addEventListener("click", e => {
  const btn = e.target.closest("[data-open]");
  if (btn) openDay(Number(btn.dataset.open));
});
document.getElementById("d-close").addEventListener("click", closeDetail);
document.querySelectorAll("[data-jump]").forEach(btn => {
  btn.addEventListener("click", () => {
    const n = Number(btn.dataset.jump);
    document.getElementById(`day-${n}`)?.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    openDay(n);
  });
});
render();
</script>
