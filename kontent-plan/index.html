<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алифер · контент-план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ebe7df;
  --paper: #ffffff;
  --ink: #222;
  --muted: #75716a;
  --line: #ddd8ce;
  --yellow: #ffe566;
  --gray: #efefef;
  --sense: #e8e8e8;
  --blue: #d7ebfa;
  --pink: #f8d9d2;
  --green: #d9ecd0;
  --lilac: #e4ddf4;
  --cream: #fff6d6;
  --terra: #b4553a;
  --rail: #f7f5f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Manrope, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

/* —— header —— */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.top h1 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.top .meta { font-size: 12px; color: var(--muted); }
.top .meta b { color: var(--terra); font-weight: 700; }

/* —— shell —— */
.shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 0;
  overflow: hidden;
}

/* —— left rail —— */
.rail {
  background: var(--rail);
  border-right: 1px solid var(--line);
  overflow: auto;
  min-height: 0;
  padding: 10px 10px 24px;
}
.phase-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 12px 8px 6px;
}
.phase-label:first-child { padding-top: 4px; }
.phase-cta {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
  color: var(--terra);
  margin-top: 2px;
}

.day-btn {
  width: 100%;
  appearance: none;
  border: 1px solid transparent;
  background: var(--paper);
  border-radius: 10px;
  padding: 8px 8px 8px 8px;
  text-align: left;
  cursor: pointer;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  align-items: start;
  margin-bottom: 6px;
  font: inherit;
  color: inherit;
  box-shadow: 0 1px 0 rgba(0,0,0,.03);
  transition: border-color .12s ease, background .12s ease;
}
.day-btn:hover { border-color: #cfc8bb; }
.day-btn[aria-current="true"] {
  border-color: var(--terra);
  background: #fffaf7;
  box-shadow: 0 0 0 1px rgba(180,85,58,.2);
}
.day-btn .n {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--yellow);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
}
.day-btn .t {
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.day-btn .c {
  grid-column: 2;
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
}

/* —— detail canvas (Miro-like) —— */
.canvas {
  overflow: auto;
  min-height: 0;
  padding: 20px 28px 40px;
  background:
    radial-gradient(circle at 1px 1px, #d9d4cb 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
}

.sheet {
  max-width: 520px;
  margin: 0 auto;
}

.sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.badge {
  background: var(--yellow);
  min-width: 36px;
  height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  border: 1px solid #ead97a;
}
.sheet-head .when {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.sheet-head .where {
  font-size: 12px;
  color: var(--terra);
  font-weight: 700;
}

.box {
  border-radius: 12px;
  padding: 14px 16px;
  border: 1px solid rgba(0,0,0,.06);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.box.sense {
  background: var(--sense);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.35;
}
.box.phase {
  background: var(--gray);
  font-size: 12px;
  font-weight: 600;
  color: #555;
  margin-bottom: 8px;
  padding: 10px 14px;
}
.box.phase b { color: var(--terra); }

.arrow {
  display: flex;
  justify-content: center;
  color: #aaa;
  font-size: 18px;
  line-height: 1;
  padding: 6px 0;
  user-select: none;
}

.box.blue { background: var(--blue); }
.box.pink { background: var(--pink); }
.box.green { background: var(--green); }
.box.lilac { background: var(--lilac); }
.box.cream { background: var(--cream); }

.box .label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: #666;
  margin-bottom: 6px;
}
.box .title {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 8px;
  line-height: 1.3;
}
.box ul {
  padding-left: 1.1em;
  font-size: 13px;
  line-height: 1.4;
}
.box li { margin-bottom: 4px; }
.box li:last-child { margin-bottom: 0; }

.box.cta {
  background: #1c1f1a;
  color: #f5f1e8;
  border: 0;
}
.box.cta .label { color: #e2a98f; }
.box.cta .title { color: #fff; margin-bottom: 0; font-size: 14px; }

.empty {
  max-width: 420px;
  margin: 12vh auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* —— mobile —— */
@media (max-width: 820px) {
  body {
    display: grid;
    grid-template-rows: auto auto 1fr;
    overflow: hidden;
  }
  .shell {
    display: contents;
  }
  .rail {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .phase-label {
    display: none;
  }
  .day-btn {
    flex: 0 0 150px;
    margin: 0;
    grid-template-columns: 24px 1fr;
    padding: 8px;
  }
  .day-btn .n { width: 24px; height: 24px; font-size: 12px; }
  .day-btn .t { -webkit-line-clamp: 3; font-size: 11px; }
  .day-btn .c { display: none; }
  .canvas { padding: 14px 14px 32px; }
  .sheet { max-width: none; }
}
</style>
</head>

const PHASES = [
  { id: 1, title: "Этап 1 · Узнавание", cta: "→ анкета + «5 признаков»" },
  { id: 2, title: "Этап 2 · Старые способы / кишечник", cta: "→ магнит" },
  { id: 3, title: "Этап 3 · Система и кейсы", cta: "→ предзапись → закрытый" },
  { id: 4, title: "День эфира", cta: "→ явка" }
];

const rail = document.getElementById("rail");
const canvas = document.getElementById("canvas");
let current = 1;

function shortSense(s) {
  return s.length > 78 ? s.slice(0, 76).trim() + "…" : s;
}

function buildRail() {
  rail.innerHTML = "";
  PHASES.forEach(ph => {
    const days = DAYS.filter(d => d.phase === ph.id);
    if (!days.length) return;
    const label = document.createElement("div");
    label.className = "phase-label";
    label.innerHTML = `${ph.title}<span class="phase-cta">${ph.cta}</span>`;
    rail.appendChild(label);
    days.forEach(d => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day-btn";
      btn.dataset.n = d.n;
      btn.setAttribute("aria-current", d.n === current ? "true" : "false");
      btn.innerHTML = `
        <span class="n">${d.n}</span>
        <span class="t">${shortSense(d.sense)}</span>
        <span class="c">${d.cta}</span>
      `;
      btn.addEventListener("click", () => selectDay(d.n));
      rail.appendChild(btn);
    });
  });
}

function selectDay(n) {
  current = n;
  document.querySelectorAll(".day-btn").forEach(b => {
    b.setAttribute("aria-current", b.dataset.n === String(n) ? "true" : "false");
  });
  const d = DAYS.find(x => x.n === n);
  if (!d) return;

  const blocks = d.blocks.map((b, i) => `
    ${i ? '<div class="arrow">↓</div>' : ''}
    <section class="box ${b.type}">
      <div class="label">${b.label}</div>
      <div class="title">${b.title}</div>
      <ul>${b.items.map(item => `<li>${item}</li>`).join("")}</ul>
    </section>
  `).join("");

  canvas.innerHTML = `
    <article class="sheet">
      <div class="sheet-head">
        <div class="badge">${d.n}</div>
        <div>
          <div class="when">День ${d.n}</div>
          <div class="where">${d.cta}</div>
        </div>
      </div>
      <div class="box phase">${d.phaseTitle} · <b>${d.phaseCta}</b></div>
      <div class="box sense">${d.sense}</div>
      <div class="arrow">↓</div>
      ${blocks}
      <div class="arrow">↓</div>
      <div class="box cta">
        <div class="label">Куда зовём</div>
        <div class="title">${d.cta}</div>
      </div>
    </article>
  `;
  canvas.scrollTop = 0;

  const active = rail.querySelector(`.day-btn[data-n="${n}"]`);
  active?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

buildRail();
selectDay(1);
</script>
