<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алифер · контент-план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ec;
  --ink: #1a1a18;
  --muted: #6a6760;
  --line: #e2ddd3;
  --yellow: #f5e6a8;
  --gray: #eceae4;
  --gray2: #e4e1d9;
  --blue: #dceaf5;
  --pink: #f3ddd6;
  --green: #dde9d4;
  --lilac: #e6e0f2;
  --cream: #fffdf8;
  --cta: #b4553a;
  --panel: #1b1f18;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Manrope, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.35;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

.top {
  flex: 0 0 auto;
  background: rgba(244,242,236,.97);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px 8px;
}
.top h1 { font-size: 16px; font-weight: 800; }
.top p { color: var(--muted); font-size: 12px; margin-top: 2px; }

.phase-bar {
  display: flex;
  gap: 6px;
  padding: 8px 14px;
  overflow-x: auto;
  flex: 0 0 auto;
  border-bottom: 1px solid var(--line);
  background: #efece4;
  scrollbar-width: thin;
}
.phase-bar button {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 7px 10px;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
}
.phase-bar button[aria-pressed="true"] {
  background: var(--panel);
  color: #f6f2e9;
  border-color: var(--panel);
}

.main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.board-wrap {
  flex: 1 1 auto;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 10px 14px;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
}
.board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(168px, 200px);
  gap: 8px;
  width: max-content;
  height: 100%;
  align-items: stretch;
}

.col {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  max-height: calc(100dvh - 168px);
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
  overflow: hidden;
}
.col:hover { border-color: #cbbba8; }
.col[aria-selected="true"] {
  border-color: var(--cta);
  box-shadow: 0 0 0 2px rgba(180,85,58,.18);
}
.col.hidden { display: none; }

.num {
  background: var(--yellow);
  font-weight: 800;
  font-size: 14px;
  text-align: center;
  padding: 6px;
  flex: 0 0 auto;
}
.date {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  flex: 0 0 auto;
}
.phase {
  background: var(--gray);
  padding: 7px 8px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.3;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.phase small {
  display: block;
  margin-top: 3px;
  font-weight: 700;
  color: var(--cta);
  font-size: 10px;
  -webkit-line-clamp: unset;
}
.sense {
  background: var(--gray2);
  padding: 8px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  border-bottom: 1px solid var(--line);
  flex: 1 1 auto;
  overflow: auto;
}
.preview {
  padding: 7px 8px;
  font-size: 10px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  line-height: 1.3;
}
.preview b { color: var(--ink); font-weight: 700; }
.cta {
  background: var(--panel);
  color: #f6f2e9;
  padding: 8px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
  flex: 0 0 auto;
}
.cta em {
  display: block;
  font-style: normal;
  color: #e2a98f;
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.hint {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 5px;
  background: #faf8f3;
  flex: 0 0 auto;
}

/* Detail drawer */
.drawer {
  flex: 0 0 auto;
  max-height: 42dvh;
  border-top: 1px solid var(--line);
  background: #fff;
  display: none;
  flex-direction: column;
  min-height: 0;
}
.drawer.open { display: flex; }
.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
  background: #faf8f3;
  flex: 0 0 auto;
}
.drawer-head h2 {
  font-size: 14px;
  font-weight: 800;
  line-height: 1.3;
}
.drawer-head p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.drawer-head button {
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.drawer-body {
  overflow: auto;
  padding: 10px 14px 14px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  min-height: 0;
}
.card {
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.35;
}
.card h4 {
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
  opacity: .7;
  margin-bottom: 4px;
}
.card strong.t {
  display: block;
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 4px;
}
.card ul { padding-left: 1.05em; }
.card li { margin-bottom: 2px; }
.card.blue { background: var(--blue); }
.card.pink { background: var(--pink); }
.card.green { background: var(--green); }
.card.lilac { background: var(--lilac); }
.card.yellow { background: var(--yellow); }
.card.full { grid-column: 1 / -1; }

@media (max-width: 900px) {
  .board { grid-auto-columns: minmax(150px, 170px); }
  .col { max-height: calc(100dvh - 280px); }
  .drawer { max-height: 48dvh; }
  .drawer-body { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .board { grid-auto-columns: minmax(140px, 58vw); }
  .drawer { max-height: 50dvh; }
}
@media (min-height: 900px) {
  .col { max-height: calc(100dvh - 150px); }
  .drawer { max-height: 36dvh; }
}
</style>
</head>
<body>

<header class="top">
  <h1>Контент-план · Алифер</h1>
  <p>~2,5 недели до закрытого эфира. Кликни день — раскладка снизу. Листай этапы вправо.</p>
</header>

<nav class="phase-bar" aria-label="Этапы">
  <button type="button" data-filter="all" aria-pressed="true">Все 18 дней</button>
  <button type="button" data-filter="1" aria-pressed="false">Этап 1 · анкета</button>
  <button type="button" data-filter="2" aria-pressed="false">Этап 2 · магнит</button>
  <button type="button" data-filter="3" aria-pressed="false">Этап 3 · предзапись</button>

</nav>

<div class="main">
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <aside class="drawer" id="drawer" aria-live="polite">

      </div>
      <button type="button" id="d-close">Свернуть</button>
    </div>
    <div class="drawer-body" id="d-body"></div>
  </aside>
</div>

const board = document.getElementById("board");
const drawer = document.getElementById("drawer");
const dTitle = document.getElementById("d-title");
const dSub = document.getElementById("d-sub");
const dBody = document.getElementById("d-body");
let selected = null;

function renderBoard(filter) {
  board.innerHTML = "";
  DAYS.forEach(d => {
    if (filter !== "all" && String(d.phase) !== String(filter)) return;
    const col = document.createElement("article");
    col.className = "col";
    col.dataset.phase = d.phase;
    col.dataset.n = d.n;
    col.tabIndex = 0;
    col.setAttribute("role", "button");
    col.setAttribute("aria-selected", selected === d.n ? "true" : "false");
    col.innerHTML = `
      <div class="num">${d.n}</div>
      <div class="date">День ${d.n}</div>
      <div class="phase">${d.phaseTitle}<small>${d.phaseCta}</small></div>
      <div class="sense">${d.sense}</div>
      <div class="preview"><b>Внутри:</b> ${d.preview}</div>
      <div class="cta"><em>Куда зовём</em>${d.cta}</div>
      <div class="hint">нажми · раскладка</div>
    `;
    col.addEventListener("click", () => openDay(d.n));
    col.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDay(d.n); }
    });
    board.appendChild(col);
  });
}

function openDay(n) {
  const d = DAYS.find(x => x.n === n);
  if (!d) return;
  if (selected === n && drawer.classList.contains("open")) {
    closeDrawer();
    return;
  }
  selected = n;
  document.querySelectorAll(".col").forEach(c => {
    c.setAttribute("aria-selected", c.dataset.n === String(n) ? "true" : "false");
  });
  dTitle.textContent = `День ${d.n}. ${d.sense}`;
  dSub.textContent = `${d.phaseTitle} · ${d.cta}`;
  dBody.innerHTML = d.blocks.map(b => `
    <div class="card ${b.type}${d.blocks.length === 1 ? " full" : ""}">
      <h4>${b.label}</h4>
      <strong class="t">${b.title}</strong>
      <ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>
  `).join("");
  drawer.classList.add("open");
  const col = document.querySelector(`.col[data-n="${n}"]`);
  col?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function closeDrawer() {
  selected = null;
  drawer.classList.remove("open");
  document.querySelectorAll(".col").forEach(c => c.setAttribute("aria-selected", "false"));
}

document.getElementById("d-close").addEventListener("click", closeDrawer);

document.querySelectorAll(".phase-bar button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".phase-bar button").forEach(b => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    closeDrawer();
    renderBoard(btn.dataset.filter);
    board.parentElement.scrollLeft = 0;
  });
});

renderBoard("all");
</script>
